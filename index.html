<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#78c95b" />
    <meta name="description" content="포착팜 쿠폰을 등록하고 농장 보상을 받아보세요." />
    <title>포착팜 | 사전예약 쿠폰 등록</title>
    <link rel="icon" type="image/png" href="/assets/pochakfarm-logo.png" />
    <link rel="apple-touch-icon" href="/assets/pochakfarm-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar" aria-label="포착팜 헤더">
        <a class="brand" href="/coupon" aria-label="포착팜 쿠폰 홈">
          <img class="brand-mark" src="/assets/pochakfarm-logo.png" alt="" />
          <img class="brand-title" src="/assets/header-brand.png" alt="" />
          <span class="sr-only">포착팜</span>
        </a>
        <div id="account-area"></div>
      </header>

      <section class="hero" aria-live="polite">
        <div class="game-card">
          <div class="modal-content">
            <div class="modal-intro">
              <div class="eyebrow"><span>✦</span> SPECIAL COUPON <span>✦</span></div>
              <h1><img src="/assets/reservation-coupon-title.png" alt="" /><span class="sr-only">포착팜 사전예약 쿠폰 등록</span></h1>
            </div>
            <div id="app-card"></div>
          </div>
        </div>
        <p class="help-text"><span aria-hidden="true">🌱</span> 쿠폰은 계정당 1회만 사용할 수 있어요.</p>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
