<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#78c95b" />
    <meta name="description" content="포착팜 쿠폰을 등록하고 농장 보상을 받아보세요." />
    <title>포착팜 | 쿠폰 등록</title>
    <link rel="icon" type="image/png" href="/assets/pochakfarm-logo.png" />
    <link rel="apple-touch-icon" href="/assets/pochakfarm-logo.png" />
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar" aria-label="포착팜 헤더">
        <a class="brand" href="/coupon" aria-label="포착팜 쿠폰 홈">
          <img class="brand-mark" src="/assets/pochakfarm-logo.png" alt="" />
          <span class="brand-copy"><strong>포착팜</strong><small>POCHAK FARM</small></span>
        </a>
        <div id="account-area"></div>
      </header>
      <section class="hero" aria-live="polite">
        <div class="eyebrow"><span>✦</span> SPECIAL COUPON <span>✦</span></div>
        <h1>포착팜 쿠폰 등록</h1>
        <p>쿠폰을 등록하고<br class="mobile-only" /> 특별한 농장 보상을 받아보세요!</p>
        <div id="app-card" class="game-card"></div>
        <p class="help-text"><span aria-hidden="true">🌱</span> 쿠폰은 계정당 1회만 사용할 수 있어요.</p>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
